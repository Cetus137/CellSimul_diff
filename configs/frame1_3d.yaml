# ─────────────────────────────────────────────────────────────────────────────
# 3D Centre-Conditioned Diffusion — Frame 1 config
#
# Model: ConditionalUNet3D wrapped in DDPM3D
# Input cubes: 256×256×256  →  4 × 128³ sub-patches per cube
#              (z slab z_start:z_start+128, 2×2 Y/X tiling at stride 128)
# Conditioning: heatmap + distance  (C = 2, no boundary channel)
# ─────────────────────────────────────────────────────────────────────────────

# ── General ───────────────────────────────────────────────────────────────────
device: "cuda"
random_seed: 42

# ── Raw data ─────────────────────────────────────────────────────────────────
# Point this at your folder of 256³ cube .tif files.
# Expected naming:
#   cube_0000.tif          ← raw fluorescence volume
#   cube_0000_masks.tif    ← instance segmentation volume
raw_data:
  cubes_dir: "/users/kir-fritzsche/aif490/devel/tissue_analysis/CellSimul_diff/data_live_node2_3d/"  # contains cube_*.tif and cube_*_masks.ti
  cube_suffix: ".tif"
  mask_suffix: "_masks.tif"

# ── Processed data ────────────────────────────────────────────────────────────
processed_data:
  patches_dir:
    - "/users/kir-fritzsche/aif490/devel/tissue_analysis/CellSimul_diff/data_live_node1_3d/"
    - "/users/kir-fritzsche/aif490/devel/tissue_analysis/CellSimul_diff/data_live_node2_3d/"

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  patch_size: 128           # Cubic patch side length (voxels)
  patch_stride: 128         # Y/X stride (128 = non-overlapping 2×2 grid)
  z_start: 24               # First z-slice of the cropped slab (0-indexed)
                            # Slab = volume[z_start : z_start+128]
                            # Set to 0 for top slab, 128 for bottom slab
  min_cells_per_patch: 5    # Reject patches with fewer cells
  min_cell_volume: 500      # Voxels — reject cells smaller than this
  max_cell_volume: 500000   # Voxels — reject cells larger than this
  centre_heatmap_sigma: 3.0 # Gaussian sigma for heatmap blobs (voxels)

# ── Train / val / test split ──────────────────────────────────────────────────
splits:
  train_fraction: 0.8
  val_fraction:   0.1
  test_fraction:  0.1
  random_seed:    43

# ── Augmentation ──────────────────────────────────────────────────────────────
augmentation:
  random_flip_horizontal: true
  random_flip_vertical:   true
  random_rotate_90:       true   # rotation in y-x plane only

# ── U-Net architecture ────────────────────────────────────────────────────────
unet:
  in_channels:  1   # Single-channel fluorescence
  out_channels: 1

  # Conditioning channels (no boundary in 3D)
  conditioning:
    heatmap:  true    # Channel 0: Gaussian blobs at centres
    distance: false    # Channel 1: Distance-to-nearest-centre (percentile-normalised)
  # → condition_channels = 2

  # Memory-efficient defaults for a single A100-40 GB at batch_size=1
  base_channels: 32
  channel_multipliers: [1, 2, 4, 8]   # feature channels: [32, 64, 128, 256]
  num_res_blocks: 2
  # attention_resolutions intentionally absent — no attention in 3D UNet
  norm_groups:   32
  time_emb_dim:  256
  dropout:       0.1

# ── Diffusion ─────────────────────────────────────────────────────────────────
diffusion:
  timesteps: 1000
  beta_schedule: "linear"
  beta_start:    0.0001
  beta_end:      0.02
  prediction_type: "epsilon"
  loss_type: "l2"
  cfg:
    enabled:       false
    dropout_prob:  0.1
    guidance_scale: 3.0

# ── Optimizer ─────────────────────────────────────────────────────────────────
optimizer:
  type:          "AdamW"
  learning_rate: 1.0e-4
  weight_decay:  0.01
  betas:         [0.9, 0.999]
  eps:           1.0e-8

# ── LR scheduler ──────────────────────────────────────────────────────────────
scheduler:
  type:         "cosine"
  warmup_steps: 500
  min_lr:       1.0e-6

# ── Realistic centre generation (measured from training data) ─────────────────
# Source: configs/centre_stats_3d.yaml  (scripts/analyze_training_stats.py)
# Data:   data_live_node1_3d/train  +  data_live_node2_3d/train
centre_generation_3d:
  border_margin: 10
  max_attempts:  50
  # ---- N distribution (measured) -----------------------------------------
  n_mean:        25.97   # mean cells per 128³ patch
  n_std:         7.57
  n_min:         15      # p5  of training distribution
  n_max:         41      # p95 of training distribution
  # ---- Exclusion radius (p5 of per-cell NN distances) --------------------
  min_distance:  25.61
  # ---- Marginal KDE histograms (16 bins, sum to 1.0) ---------------------
  # z: notable gradient — higher density near top of slab (z=0) than bottom
  density_grid_z: [0.090431, 0.100492, 0.067893, 0.058719, 0.080659, 0.077776, 0.069163, 0.065828,
                   0.064358, 0.062663, 0.060564, 0.051228, 0.040920, 0.038762, 0.037821, 0.032724]
  # y: slight edge-depletion at both ends (border margin effect + tissue boundary)
  density_grid_y: [0.042549, 0.073101, 0.067345, 0.066003, 0.061456, 0.062262, 0.063075, 0.063527,
                   0.063447, 0.063205, 0.065533, 0.066041, 0.063606, 0.066835, 0.075055, 0.036960]
  # x: same edge-depletion pattern as y (symmetric tiling)
  density_grid_x: [0.042636, 0.073598, 0.066601, 0.064289, 0.063014, 0.064489, 0.064295, 0.064053,
                   0.064122, 0.062982, 0.064327, 0.065254, 0.062745, 0.068161, 0.072217, 0.037218]

# ── DataLoader ────────────────────────────────────────────────────────────────
dataloader:
  batch_size:  1       # 128³ patches are large; increase only if VRAM allows
  num_workers: 8

# ── Training ──────────────────────────────────────────────────────────────────
training:
  num_epochs:     100
  gradient_clip:  1.0
  mixed_precision: true
  visualize:      true

  log_every:      100
  save_every:     1000
  validate_every: 5000

  checkpoint_dir: "checkpoints/frame1_3d_combined_noD_noZ_raw"
  viz_dir:        "visualizations/frame1_3d_combined_noD_noZ_raw"
  keep_last_n_checkpoints: 5

  ema:
    enabled:      true
    decay:        0.9999
    update_every: 10

  small_data_mode:
    enabled:            false
    p_uncond:           0.0
    low_noise_bias:     false
    low_noise_fraction: 0.3
    low_noise_weight:   3.0

  debug_overfit:
    enabled:             false
    num_patches:         4
    disable_augmentation: true
    disable_cfg:          true
