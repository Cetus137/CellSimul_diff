# Diffusion model architecture configuration

# U-Net architecture
unet:
  # Input/output channels
  in_channels: 1  # Grayscale microscopy image
  out_channels: 1  # Predicted noise/image
  condition_channels: 3  # Centre heatmap + distance map + boundary map
  
  # Architecture dimensions
  base_channels: 128
  channel_multipliers: [1, 2, 3, 4]  # [128, 256, 384, 512]
  num_res_blocks: 2  # Per resolution level
  
  # Attention settings
  attention_resolutions: [16, 8]  # Apply attention at these spatial resolutions
  num_heads: 8
  
  # Normalization and activation
  norm_groups: 32  # GroupNorm groups
  dropout: 0.1
  
  # Timestep embedding
  time_emb_dim: 512

# Diffusion process (DDPM)
diffusion:
  # Noise schedule
  timesteps: 1000
  beta_schedule: "linear"  # Options: linear, cosine, quadratic
  beta_start: 0.0001
  beta_end: 0.02
  
  # Prediction type
  prediction_type: "epsilon"  # Predict noise (ε-prediction)
  
  # Loss function
  loss_type: "l2"  # Options: l1, l2, huber
  
  # Classifier-free guidance
  cfg:
    enabled: true
    dropout_prob: 0.1  # Probability of dropping conditioning during training
    guidance_scale: 3.0  # Scale for sampling (w in CFG formula)

# Model initialization
init:
  weight_init: "xavier_uniform"  # Options: xavier_uniform, kaiming_normal, default
