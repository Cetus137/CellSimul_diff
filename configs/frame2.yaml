# Frame-2 training config
# Single file for data paths, model architecture, and training settings.
# Used by: scripts/train_frame2.py, preprocessing/build_temporal_dataset.py
# The only difference from frame1.yaml: condition_channels=4, pairs_dir, checkpoint/viz dirs.

# ---- Data -----------------------------------------------------------
pairs_dir: "data_multiz_mincell20/processed/pairs"  # root with train/ val/ test/ subdirs

# ---- Temporal Dataset Build -----------------------------------------
temporal_dataset:
  raw_dir: "data/raw"
  seg_dir: "data/segmented"
  out_dir: "data_mincell20/processed/pairs"
  min_cells: 20
  train_frac: 0.8
  val_frac: 0.1

augmentation:
  random_flip_horizontal: true
  random_flip_vertical: true
  random_rotate_90: true

# ---- Model ----------------------------------------------------------
unet:
  in_channels: 1
  out_channels: 1
  # Which of the three C_{t+1} geometry channels to use (same flags as frame1)
  conditioning:
    heatmap: true
    distance: false
    boundary: false
  prev_frame: true   # append I_t as the final conditioning channel (always 1 channel)
  base_channels: 128
  channel_multipliers: [1, 2, 3, 4]
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  num_heads: 8
  norm_groups: 32
  dropout: 0.1
  time_emb_dim: 512

diffusion:
  timesteps: 1000
  beta_schedule: "linear"
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: "epsilon"
  loss_type: "l2"
  cfg:
    enabled: true
    dropout_prob: 0.1
    guidance_scale: 3.0

init:
  weight_init: "xavier_uniform"

# ---- Training -------------------------------------------------------
optimizer:
  type: "AdamW"
  learning_rate: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: "cosine"
  warmup_steps: 1000
  min_lr: 1.0e-6

training:
  num_epochs: 75
  gradient_clip: 1.0

  small_data_mode:
    enabled: true
    p_uncond: 0.0
    low_noise_bias: false
    low_noise_fraction: 0.3
    low_noise_weight: 3.0

  debug_overfit:
    enabled: false
    num_patches: 8
    disable_augmentation: true
    disable_cfg: true

  ema:
    enabled: true
    decay: 0.9999
    update_every: 10

  mixed_precision: true
  log_every: 200
  save_every: 2000
  validate_every: 10000
  num_val_samples: 16
  visualize: true
  checkpoint_dir: "checkpoints/frame2"
  viz_dir: "visualizations/frame2"
  keep_last_n_checkpoints: 5
  save_best_only: false

dataloader:
  batch_size: 2
  num_workers: 4

random_seed: 44
device: "cuda"
