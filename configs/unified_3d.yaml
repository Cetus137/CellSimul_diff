# ─────────────────────────────────────────────────────────────────────────────
# 3D Unified Autoregressive Diffusion — config
#
# Model: ConditionalUNet3D wrapped in DDPM3D
# Purpose: Single model replacing both frame1_3d and frame2_3d.
#          Trained jointly on single-frame patches and temporal pairs.
#          At inference:
#            • Frame 0:   conditioning = [heatmap_t,  zeros          ]
#            • Frame t+1: conditioning = [heatmap_t1, volume_t in 0-1]
#
# Conditioning: heatmap + prev_frame  (C = 2 total)
#   Channel 0: Gaussian blob heatmap of target-frame centres  in [0, 1]
#   Channel 1: Previous frame V_{t-1} re-ranged to [0, 1]     (zeros for first frame)
# ─────────────────────────────────────────────────────────────────────────────

# ── General ───────────────────────────────────────────────────────────────────
device: "cuda"
random_seed: 42

# ── Unified dataset ───────────────────────────────────────────────────────────
# Single-frame patches + temporal pairs are mixed with WeightedRandomSampler.
unified_dataset:
  patches_dirs:
  #  - "/users/kir-fritzsche/aif490/devel/tissue_analysis/CellSimul_diff/data_live_node1_3d/"
    - "/users/kir-fritzsche/aif490/devel/tissue_analysis/CellSimul_diff/data_live_node1_3d/"
  pairs_dirs:
  #  - "/users/kir-fritzsche/aif490/devel/tissue_analysis/CellSimul_diff/data_live_node1_3d/pairs/"
    - "/users/kir-fritzsche/aif490/devel/tissue_analysis/CellSimul_diff/data_live_node1_3d/pairs/"
  # Relative weight given to each pair item vs. each single-frame item.
  # Both pools are ~equal size (~14 500 vs ~16 500 train samples), so 1.0 is
  # a sensible default.  Increase to e.g. 2.0 if temporal structure is under-learned.
  pair_sample_weight: 1.0
  # Probability of zeroing the prev-frame channel (ch1) for pair items.
  # Teaches the model to handle the no-previous-frame case (frame 0 at inference).
  prev_frame_dropout: 0.15

# ── Preprocessing ─────────────────────────────────────────────────────────────
preprocessing:
  patch_size: 128
  patch_stride: 128
  z_start: 24
  min_cells_per_patch: 5
  min_cell_volume: 500
  max_cell_volume: 500000
  centre_heatmap_sigma: 5.0
  distance_percentile: 99.0

# ── Augmentation ──────────────────────────────────────────────────────────────
augmentation:
  enabled: true
  random_flip_horizontal: true
  random_flip_vertical: true
  random_rotate_90: true

# ── U-Net architecture ────────────────────────────────────────────────────────
unet:
  in_channels:  1
  out_channels: 1

  # 2-channel conditioning: heatmap + prev_frame
  conditioning:
    heatmap:  true    # Channel 0: Gaussian blobs at target-frame centres
    distance: false   # disabled — redundant given heatmap + prev_frame
  prev_frame: true    # Channel 1: V_{t-1} in [0, 1]  (zeros for frame 0)
  # → condition_channels = 1 + 1 = 2

  base_channels: 32
  channel_multipliers: [1, 2, 4, 8]   # feature maps: [32, 64, 128, 256]
  num_res_blocks: 2
  norm_groups:   32
  time_emb_dim:  256
  dropout:       0.1

# ── Diffusion ─────────────────────────────────────────────────────────────────
diffusion:
  timesteps: 1000
  beta_schedule: "linear"
  beta_start:    0.0001
  beta_end:      0.02
  prediction_type: "epsilon"
  loss_type: "l2"
  min_snr_gamma: 5.0    # Min-SNR weighting (Hang et al. 2023); null to disable
  cfg:
    enabled:        false
    dropout_prob:   0.0
    guidance_scale: 1.0

# ── Optimizer ─────────────────────────────────────────────────────────────────
optimizer:
  type:          "AdamW"
  learning_rate: 1.0e-4
  weight_decay:  0.01
  betas:         [0.9, 0.999]
  eps:           1.0e-8

# ── LR scheduler ──────────────────────────────────────────────────────────────
scheduler:
  type:         "cosine"
  warmup_steps: 500
  min_lr:       1.0e-6

# ── DataLoader ────────────────────────────────────────────────────────────────
dataloader:
  batch_size:  2
  num_workers: 8

# ── Training ──────────────────────────────────────────────────────────────────
training:
  num_epochs:      300
  gradient_clip:   1.0
  mixed_precision: true
  visualize:       true

  log_every:      100
  save_every:     2500
  validate_every: 2500
  max_val_batches: 200

  checkpoint_dir: "checkpoints/unified_3d_node1_C_no_cfg_SNR"
  viz_dir:        "visualizations/unified_3d_node1_C_no_cfg_SNR"
  keep_last_n_checkpoints: 5

  ema:
    enabled:      true
    decay:        0.9999
    update_every: 10

  small_data_mode:
    enabled:            true
    p_uncond:           0.0
    low_noise_bias:     false
    low_noise_fraction: 0.3
    low_noise_weight:   3.0

  debug_overfit:
    enabled:              false
    num_patches:          4
    disable_augmentation: true
    disable_cfg:          true

# ── Centre generation (used by --method realistic in generate_timeseries_unified_3d.py) ──
# Stats derived from data_live_node1_3d only (training data source).
# Re-run scripts/analyze_training_stats.py --save_stats if training data changes.
centre_generation_3d:
  border_margin: 10
  max_attempts:  50
  n_mean:        33.04  # mean cells per 128³ patch (node1 only)
  n_std:         8.39
  n_min:         17     # p5  of training distribution
  n_max:         44     # p95 of training distribution
  min_distance:  27.2   # p5 of per-cell nearest-neighbour distances (voxels)
  # 16-bin marginal KDE histograms; each axis sums to 1.0 (node1 only)
  density_grid_z: [0.17334,  0.070774, 0.02802,  0.059681, 0.10931,  0.08274,  0.055821, 0.059164,
                   0.07215,  0.059877, 0.050016, 0.052995, 0.044975, 0.038755, 0.024859, 0.017524]
  density_grid_y: [0.041989, 0.074925, 0.067955, 0.064743, 0.060591, 0.063199, 0.066294, 0.064816,
                   0.059644, 0.061611, 0.06636,  0.066804, 0.05837,  0.064539, 0.080388, 0.037772]
  density_grid_x: [0.047182, 0.071524, 0.064947, 0.063985, 0.061589, 0.064058, 0.063701, 0.064685,
                   0.064743, 0.063862, 0.06416,  0.065792, 0.061407, 0.066906, 0.072026, 0.039433]
