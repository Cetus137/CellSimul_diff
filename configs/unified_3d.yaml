  border_margin: 10
  max_attempts:  50
  n_mean:        25.97   # mean cells per 128³ patch
  n_std:         7.57
  n_min:         15      # p5  of training distribution
  n_max:         41      # p95 of training distribution
  min_distance:  25.61   # p5 of per-cell nearest-neighbour distances (voxels)
  # 32-bin marginal KDE histograms; each axis sums to 1.0
  density_grid_z: [0.0385, 0.0521, 0.0507, 0.0491, 0.0399, 0.0282, 0.0268, 0.032,  0.039,  0.0415,
                   0.0412, 0.0366, 0.0348, 0.0344, 0.0331, 0.0324, 0.0324, 0.032,  0.031,  0.0317,
                   0.0313, 0.0293, 0.0272, 0.0241, 0.0218, 0.0194, 0.0195, 0.0194, 0.0189, 0.019,
                   0.0175, 0.0152]
  density_grid_y: [0.0144, 0.0284, 0.0373, 0.0355, 0.0337, 0.0338, 0.0334, 0.0326, 0.0303, 0.0311,
                   0.0314, 0.0307, 0.0314, 0.0318, 0.0319, 0.0316, 0.0315, 0.0319, 0.0319, 0.0311,
                   0.0324, 0.0332, 0.0332, 0.0331, 0.0311, 0.0324, 0.0327, 0.0343, 0.0369, 0.0381,
                   0.0233, 0.0138]
  density_grid_x: [0.015,  0.0278, 0.0371, 0.0366, 0.034,  0.0325, 0.0324, 0.0319, 0.0317, 0.0314,
                   0.0322, 0.0322, 0.0324, 0.0318, 0.0322, 0.0317, 0.032,  0.0323, 0.0321, 0.0308,
                   0.032,  0.0323, 0.033,  0.0321, 0.032,  0.0313, 0.0328, 0.0353, 0.0359, 0.0359,
                   0.0227, 0.0145]
