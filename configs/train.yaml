# Training configuration

# Optimization
optimizer:
  type: "AdamW"
  learning_rate: 2.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Learning rate schedule
scheduler:
  type: "cosine"  # Options: cosine, constant, linear_warmup
  warmup_steps: 1000
  min_lr: 1.0e-6

# Training loop
training:
  num_epochs: 500
  gradient_clip: 1.0
  
  # Small-data stabilizers (CRITICAL for ~100-1000 patches)
  # These prevent model collapse and ensure conditioning is learned
  small_data_mode:
    enabled: true
    # Classifier-free guidance dropout probability
    # Set to 0.0 initially to ensure model learns conditioning
    # TODO: Re-enable (e.g., 0.1) after initial convergence (~50-100 epochs)
    p_uncond: 0.0
    # Bias timestep sampling toward low noise to learn structure first
    # Samples t from [0, low_noise_fraction * T] with higher probability
    low_noise_bias: true
    low_noise_fraction: 0.3  # Focus on t in [0, 0.3*T] initially
    low_noise_weight: 3.0    # 3x more likely to sample low-noise timesteps
  
  # Overfit debug mode: intentionally train on tiny subset to verify conditioning
  # This is the PRIMARY diagnostic for conditioning correctness
  # Failure to overfit 16-32 patches indicates architectural bugs, not data issues
  debug_overfit:
    enabled: false  # Set to true for debugging
    num_patches: 32  # Train on only this many patches
    disable_augmentation: true
    disable_cfg: true  # Force p_uncond = 0.0
  
  # Exponential Moving Average
  ema:
    enabled: true
    decay: 0.9999
    update_every: 10  # Update EMA every N steps
  
  # Mixed precision training
  mixed_precision: true
  
  # Logging and checkpointing
  log_every: 100  # steps
  save_every: 5000  # steps
  validate_every: 2000  # steps
  num_val_samples: 16  # Number of samples to generate during validation
  
  # Visualization
  visualize: true  # Generate plots and visualizations during training
  viz_dir: "visualizations"  # Directory for saving visualizations
  
  # Checkpoint settings
  checkpoint_dir: "checkpoints"
  keep_last_n_checkpoints: 5
  save_best_only: false  # Save all checkpoints or only best validation

# Validation
validation:
  compute_fid: false  # Expensive, enable for final evaluation
  compute_metrics_every: 5  # epochs
  
# Distributed training (if applicable)
distributed:
  enabled: false
  backend: "nccl"
  
# Random seed for reproducibility
random_seed: 42

# Device
device: "cuda"  # Options: cuda, cpu, mps (for Apple Silicon)
