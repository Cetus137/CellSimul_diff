# Data preprocessing and loading configuration

# Raw data paths
raw_data:
  images_dir: "data/raw/images"
  masks_dir: "data/raw/masks"
  image_suffix: ".tif"
  mask_prefix: "masks_"  # Mask files have 'masks_' prefix

# Preprocessing settings
preprocessing:
  # Patch extraction
  patch_size: 256
  patch_stride: 128  # Overlap for data augmentation
  min_cells_per_patch: 3  # Minimum number of cells required in a patch
  
  # Cell filtering
  min_cell_area: 100  # pixels, discard smaller cells
  max_cell_area: 10000  # pixels, discard larger objects
  
  # Conditioning map generation
  centre_heatmap_sigma: 3.0  # Gaussian sigma for centre heatmap
  
# Processed data paths
processed_data:
  patches_dir: "data/processed/patches"
  metadata_dir: "data/processed/metadata"
  
# Dataset splits
splits:
  train_fraction: 0.8
  val_fraction: 0.1
  test_fraction: 0.1
  random_seed: 42
  splits_dir: "data/splits"

# Data loading
dataloader:
  batch_size: 8
  num_workers: 0  # Set to 0 on macOS to avoid hanging, use 4+ on Linux with GPU
  pin_memory: false  # Disable on CPU
  shuffle_train: true
  
# Data augmentation (applied during training)
augmentation:
  random_flip_horizontal: true
  random_flip_vertical: true
  random_rotate_90: true
  normalize_image: true  # Normalize to [-1, 1]
